name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid SemVer release tag format: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches package.json version
        env:
          TAG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Extract changelog for this version
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # CHANGELOG.md から該当バージョンのセクションを抽出（正規表現ではなくリテラル一致）
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" ver "]") == 1) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "CHANGELOG.md にバージョン $VERSION のエントリが見つかりません。"
            echo "自動生成リリースノートを使用します。"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          else
            # ランダムデリミタでマルチラインをGitHub Outputに安全に書き込む
            EOF_MARKER="CHANGELOG_EOF_$(openssl rand -hex 16)"
            {
              echo "notes<<${EOF_MARKER}"
              echo "$NOTES"
              echo "${EOF_MARKER}"
            } >> "$GITHUB_OUTPUT"
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (from CHANGELOG)
        if: steps.changelog.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.notes }}
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Create GitHub Release (auto-generated notes)
        if: steps.changelog.outputs.has_notes == 'false'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
